# The design fork's pipeline. Production's pipeline is not inherited: this
# repository has no backend, no deploy through CI and no secrets. The build
# job runs on every push; the browser job runs on main and on merge requests
# marked ready (label "ready"), because it costs 15 to 25 minutes.
stages: [test, browser]

variables:
  GIT_DEPTH: 0
  QA_MOCK: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key: { files: [package-lock.json] }
  paths: [.npm/]

build:
  stage: test
  image: node:22-slim
  interruptible: true
  script:
    - npm ci --no-audit --no-fund
    - node qa/cli.mjs contract
    - node qa/cli.mjs exceptions
    - node qa/contract/adapter-coverage.qa.mjs
    - node qa/contract/auth-field-contract.qa.mjs
    # Scores are stored 0-100 and shown out of 10. They used to be shown both
    # ways at once — the same idea read 72 to the inventor and 7.2 to the
    # counsel reviewing it.
    - node qa/contract/score-scale.qa.mjs
    # Static half of the desktop gate. It has existed since the gate was written
    # and CI has never invoked it — the build job runs a hand-written list, so
    # adding a gate to the repo did not add it to CI (findings F-078).
    - node qa/invariant/desktop-gate.qa.mjs
    # Both sides of the patent-status translation table. 487 production
    # patents were arriving with an unmapped status the screens could not
    # render or filter, and nothing failed because the lookup has a `?? s`
    # fallback that always produces a string.
    - node qa/contract/status-parity.qa.mjs
    - node qa/map/generate.mjs --check
    - npm run typecheck
    - npm run lint:roles
    - node tools/design/routes.mjs
    - node tools/design/credentials.mjs
    - node tools/design/manifest.mjs
    - node tools/design/fingerprint.mjs --self-test
    - npm run test:fidelity
    - npm run build:design
    - npm run storybook:build
  artifacts:
    paths: [dist/, storybook-static/]
    expire_in: 1 week

browser:
  stage: browser
  image: mcr.microsoft.com/playwright:v1.62.0-noble
  interruptible: true
  needs: [build]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /ready/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: false
  script:
    - |
      failed=""
      # Storybook FIRST, and deliberately before anything that logs in.
      #
      # These are the only browser tests here that do not touch the deployed
      # demo: `vitest --project=storybook` renders each story in this repo's own
      # Chromium, runs its play function, and fails on an axe violation because
      # .storybook/preview.tsx sets `a11y: { test: "error" }`. So it costs no
      # demo login, cannot be flaked by a Vercel deploy race, and if a shared
      # component is broken there is no point spending five logins to find out
      # from a screen.
      #
      # It lives in THIS job rather than a per-MR one because it needs a browser
      # image, and a second Playwright job on every push does not fit a
      # 400-minute month. The marginal cost here is seconds: the image and
      # `npm ci` are already paid for.
      echo "=== storybook component tests"
      npm run test-storybook || failed="$failed storybook"
      # Invariants next: it logs in as all five roles and populates the cache
      # the journeys then reuse.
      echo "=== layout invariants"
      node qa/invariant/layout.qa.mjs || failed="$failed invariants"
      # Same story as desktop-gate: registered, tagged, listed by `qa/cli.mjs
      # list`, and run by nobody. It is the gate for "no screen shows a uuid",
      # which is exactly what shipped on the draft workspace and the evaluation
      # strip (F-078).
      echo "=== no visible uuid"
      node qa/invariant/no-visible-uuid.qa.mjs || failed="$failed no-visible-uuid"
      echo "=== structural conformance"
      node qa/conformance/structure.qa.mjs || failed="$failed conformance"
      for f in qa/journey/*.qa.mjs; do
        echo "=== $f"
        node "$f" || failed="$failed $f"
      done
      # After the tiers: now the hit files exist, so a suppression that
      # matched nothing can be told from one that is merely dormant.
      echo "=== exception register (strict)"
      node qa/cli.mjs exceptions --strict || failed="$failed exceptions--strict"
      if [ -n "$failed" ]; then echo "FAILED:$failed"; exit 1; fi
  # No artifacts: qa/.sessions/ holds live authentication cookies. The log is
  # the output.
