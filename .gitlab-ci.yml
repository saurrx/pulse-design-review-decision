# pulse-frontend CI.
#
# Deployment is NOT here: Vercel builds and ships from a push webhook on main.
# This pipeline is the quality gate around that.
#
# Browser tiers (invariant, journey, conformance) deliberately do NOT run on
# merge requests. An MR's code is not deployed anywhere, so running them would
# assert things about the PREVIOUS release and report a green that means
# nothing. They run post-deploy and on a schedule instead.

stages: [test, security, verify]

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'
  # Full history: change-based test selection needs a merge base, and the
  # default shallow clone degrades it silently rather than failing.
  GIT_DEPTH: 0

default:
  interruptible: true

sast:
  stage: test

secret_detection:
  stage: test

build:
  stage: test
  image: node:22-slim
  # Not on schedules: a scheduled run exists to exercise the DEPLOYED app, and
  # the source has not changed since the last push that already built it.
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  cache:
    key: { files: [package-lock.json] }
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    # The QA gates come first: a drifted contract makes everything after it
    # untrustworthy.
    - node qa/cli.mjs contract
    - node qa/cli.mjs exceptions
    # Verb-aware: the old route-sweep matched paths and ignored methods, so a
    # rule locked to POST while every call site issued GET passed it — and that
    # was a P0 (findings.md F-015).
    - node qa/contract/adapter-coverage.qa.mjs
    - npm run typecheck
    # Encodes the IHC_ADMIN -> LEGAL_COUNSEL rename regression: a role test
    # written with .includes() matched the wrong role for months.
    - npm run lint:roles
    # Build LAST and always: a passing typecheck is not a passing build, and
    # this repo has shipped a broken main behind a green local build before.
    - npm run build
  artifacts:
    when: on_success
    expire_in: 1 week
    paths: [dist/]

gitleaks:
  stage: security
  image: { name: "zricethezav/gitleaks:latest", entrypoint: [""] }
  # Same reasoning as build: unchanged history, unchanged answer.
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"
  script:
    # The gitleaks CLI is MIT. Only the GitHub Action carries a commercial
    # licence, and we are not on GitHub.
    - |
      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        gitleaks detect --source=. --redact --exit-code 1 \
          --log-opts="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME..HEAD"
      else
        gitleaks detect --source=. --redact --exit-code 1
      fi

dependencies:
  stage: security
  image: { name: "ghcr.io/google/osv-scanner:latest", entrypoint: [""] }
  # Deliberately DOES run on schedules: new advisories are published against a
  # lockfile nobody has touched, so this is the one scan worth repeating on a
  # timer.
  script:
    # BLOCKING, deliberately. In-range npm update took this repo from 65
    # vulnerabilities (27 High) to 7, and osv-scanner.toml defers each survivor
    # explicitly with a reason and a date. An allow_failure job that is
    # permanently amber teaches everyone to ignore the colour; this way a NEW
    # vulnerability actually stops the pipeline.
    - /osv-scanner scan source --lockfile=package-lock.json --config=osv-scanner.toml

# Every tier that drives a browser, in ONE job, in sequence.
#
# They were two parallel jobs and the scheduled run failed on its first
# outing: the login throttle is 5 requests / 5 min / IP, and two jobs on the
# same runner each logging in as five roles is ten logins from one address in
# about three minutes. The inventor journey passed and the next three got 429s.
#
# One job means one qa/.sessions/ directory on one filesystem, so the five
# logins happen once and every tier after the first reuses them. The obvious
# alternative — passing the cache between jobs as an artifact — is exactly what
# must not happen: those files are live authentication cookies for the demo
# accounts, and a CI artifact is downloadable.
#
# Manual on main, automatic on a schedule: Vercel deploys asynchronously and
# never tells GitLab, so running automatically on merge races the deploy this
# is meant to inspect.
browser-tiers:
  stage: verify
  image: mcr.microsoft.com/playwright:v1.62.0-noble
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - |
      failed=""
      # Invariants first: it logs in as all five roles and populates the cache
      # the journeys then reuse.
      echo "=== layout invariants"
      node qa/invariant/layout.qa.mjs || failed="$failed invariants"
      echo "=== structural conformance"
      node qa/conformance/structure.qa.mjs || failed="$failed conformance"
      for f in qa/journey/*.qa.mjs; do
        echo "=== $f"
        node "$f" || failed="$failed $f"
      done
      # After the tiers: now the hit files exist, so a suppression that
      # matched nothing can be told from one that is merely dormant.
      echo "=== exception register (strict)"
      node qa/cli.mjs exceptions --strict || failed="$failed exceptions--strict"
      if [ -n "$failed" ]; then echo "FAILED:$failed"; exit 1; fi
  # No artifacts: qa/.sessions/ holds live authentication cookies. The log is
  # the output.
