# pulse-frontend CI.
#
# Deployment is NOT here: Vercel builds and ships from a push webhook on main.
# This pipeline is the quality gate around that.
#
# Browser tiers (invariant, journey, conformance) deliberately do NOT run on
# merge requests. An MR's code is not deployed anywhere, so running them would
# assert things about the PREVIOUS release and report a green that means
# nothing. They run post-deploy and on a schedule instead.

stages: [test, security, verify]

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'
  # Full history: change-based test selection needs a merge base, and the
  # default shallow clone degrades it silently rather than failing.
  GIT_DEPTH: 0

default:
  interruptible: true

sast:
  stage: test

secret_detection:
  stage: test

build:
  stage: test
  image: node:22-slim
  cache:
    key: { files: [package-lock.json] }
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    # The QA gates come first: a drifted contract makes everything after it
    # untrustworthy.
    - node qa/cli.mjs contract
    - node qa/cli.mjs exceptions
    - npm run typecheck
    # Encodes the IHC_ADMIN -> LEGAL_COUNSEL rename regression: a role test
    # written with .includes() matched the wrong role for months.
    - npm run lint:roles
    # Build LAST and always: a passing typecheck is not a passing build, and
    # this repo has shipped a broken main behind a green local build before.
    - npm run build
  artifacts:
    when: on_success
    expire_in: 1 week
    paths: [dist/]

gitleaks:
  stage: security
  image: { name: "zricethezav/gitleaks:latest", entrypoint: [""] }
  script:
    # The gitleaks CLI is MIT. Only the GitHub Action carries a commercial
    # licence, and we are not on GitHub.
    - |
      if [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" ]; then
        git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        gitleaks detect --source=. --redact --exit-code 1 \
          --log-opts="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME..HEAD"
      else
        gitleaks detect --source=. --redact --exit-code 1
      fi

dependencies:
  stage: security
  image: { name: "ghcr.io/google/osv-scanner:latest", entrypoint: [""] }
  script:
    # BLOCKING, deliberately. In-range npm update took this repo from 65
    # vulnerabilities (27 High) to 7, and osv-scanner.toml defers each survivor
    # explicitly with a reason and a date. An allow_failure job that is
    # permanently amber teaches everyone to ignore the colour; this way a NEW
    # vulnerability actually stops the pipeline.
    - /osv-scanner scan source --lockfile=package-lock.json --config=osv-scanner.toml

# Layout invariants against the DEPLOYED app. Manual (and scheduled) rather
# than automatic on main: Vercel's deploy finishes asynchronously and GitLab is
# never told when, so an automatic run here races the deploy it means to test.
invariants:
  stage: verify
  image: mcr.microsoft.com/playwright:v1.62.0-noble
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - node qa/invariant/layout.qa.mjs
  # No artifacts. qa/.sessions/ holds live authentication cookies for the demo
  # accounts; publishing it would put working sessions in a downloadable
  # artifact. The job's log is the output.
