# Deliberately deferred vulnerabilities.
#
# The point of this file is that `dependencies` can be a BLOCKING gate. An
# allow_failure job that is permanently amber teaches everyone to ignore the
# colour; an explicit, dated deferral means a NEW vulnerability fails the
# pipeline and has to be looked at.
#
# In-range `npm update` already took this repo from 65 vulnerabilities (27
# High) to these 7. Every one that remains needs a MAJOR version bump.

[[IgnoredVulns]]
id = "GHSA-337j-9hxr-rhxg"
ignoreUntil = 2027-03-01
reason = "react-router 6.30.6 -> 7.18.0 is a major migration (data routers, loader API). Not something to fold into a QA change. Open redirect / URL handling; the app has no user-controlled redirect targets."

